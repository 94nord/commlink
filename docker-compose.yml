# Two apps, two Dockerfiles (server/Dockerfile, web/Dockerfile), one Compose
# file to orchestrate both. Three profiles:
#
#   prod  — api + web only; every value injected by the deployment platform
#   dev   — adds PostgreSQL, MinIO, Mailpit, and Vite's own dev server
#           talking directly (CORS + Sanctum cookies) to the PHP API
#   test  — isolated, disposable stack on its own ports; boots into a
#           freshly-migrated empty database and can run alongside dev
#
#   Surface                Dev            Test
#   PHP API (HTTPS / HTTP) 8443 / 8080    9080 (HTTP)
#   Web app (Vite / static) 5173          9081
#   PostgreSQL              5432          5433
#   MinIO API / console     9000 / 9001   —
#   Mailpit UI / API        8025          9025 (API)
#   Reverb (WebSocket)      8090          — (not wired into the test stack yet)

name: commlink

services:
  # ── production ──────────────────────────────────────────────────────────────
  app:
    build:
      context: ./server
      target: app
      args:
        INSTALL_DEV_DEPENDENCIES: "false"
    restart: unless-stopped
    env_file: server/.env
    profiles: [prod]

  api:
    build:
      context: ./server
      target: web
    restart: unless-stopped
    environment:
      FPM_HOST: app
    depends_on:
      - app
    networks:
      - default
      - dokploy-network
    profiles: [prod]

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${API_URL:-https://api.example.com}
    restart: unless-stopped
    networks:
      - default
      - dokploy-network
    profiles: [prod]

  # Runs due scheduled work.
  scheduler:
    build:
      context: ./server
      target: app
      args:
        INSTALL_DEV_DEPENDENCIES: "false"
    restart: unless-stopped
    env_file: server/.env
    entrypoint: []
    command: php artisan schedule:work
    profiles: [prod]

  # ── development ─────────────────────────────────────────────────────────────
  app-dev:
    build:
      context: ./server
      target: app
      args:
        INSTALL_DEV_DEPENDENCIES: "true"
    entrypoint: entrypoint-dev.sh
    volumes:
      - ./server:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    profiles: [dev]

  api-dev:
    build:
      context: ./server
      target: web
    environment:
      FPM_HOST: app-dev
    ports:
      - "${DEV_HTTPS_PORT:-8443}:443"
      - "${DEV_HTTP_PORT:-8080}:80"
    volumes:
      - ./server/public:/var/www/html/public:ro
      - ./server/docker/nginx/templates-dev:/etc/nginx/templates:ro
      - ./server/docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app-dev
    profiles: [dev]

  scheduler-dev:
    build:
      context: ./server
      target: app
      args:
        INSTALL_DEV_DEPENDENCIES: "true"
    entrypoint: []
    command: php artisan schedule:work
    volumes:
      - ./server:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    profiles: [dev]

  # WebSocket server for the inbox's real-time push (dev only for now — the
  # test stack and Playwright still exercise the polling fallback). app-dev
  # reaches this over the Docker network at reverb-dev:8080 (REVERB_HOST/
  # PORT in server/.env); the browser connects to the host-mapped port
  # directly via web/.env's VITE_REVERB_*.
  reverb-dev:
    build:
      context: ./server
      target: app
      args:
        INSTALL_DEV_DEPENDENCIES: "true"
    entrypoint: []
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${DEV_REVERB_PORT:-8090}:8080"
    volumes:
      - ./server:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    profiles: [dev]

  web-dev:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      VITE_POLLING: "1"
      VITE_API_URL: ${DEV_API_URL:-http://localhost:8080}
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      # Shadow the host's node_modules: native binaries differ per platform.
      - web-node-modules:/app/node_modules
    profiles: [dev]

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DEV_DB_PORT:-5432}:5432"
    volumes:
      # postgres:18+ keeps PGDATA in a versioned subdirectory of this mount
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 2s
      timeout: 3s
      retries: 30
    profiles: [dev]

  # Local mail catcher: SMTP on 1025 (internal), web UI on 8025. Nothing
  # ever leaves the machine in dev.
  mailpit:
    image: axllent/mailpit
    ports:
      - "${DEV_MAILPIT_PORT:-8025}:8025"
    profiles: [dev]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "${DEV_MINIO_PORT:-9000}:9000"
      - "${DEV_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    profiles: [dev]

  # ── test ────────────────────────────────────────────────────────────────────
  app-test:
    build:
      context: ./server
      target: app
      args:
        INSTALL_DEV_DEPENDENCIES: "true"
    entrypoint: entrypoint-test.sh
    environment:
      APP_ENV: testing
      # Pinned, not inherited: server/.env is mounted with the source, so
      # without these a developer's Danish default would leak in and every
      # literal-English e2e assertion would break.
      APP_LOCALE: en
      APP_FALLBACK_LOCALE: en
      APP_DEBUG: "true"
      APP_URL: http://localhost:9080
      FRONTEND_URL: http://localhost:${TEST_WEB_PORT:-9081}
      SANCTUM_STATEFUL_DOMAINS: localhost:${TEST_WEB_PORT:-9081}
      DB_CONNECTION: pgsql
      DB_HOST: db-test
      DB_PORT: 5432
      DB_DATABASE: ${TEST_DB_DATABASE:-client_book_test}
      DB_USERNAME: ${TEST_DB_USERNAME:-client_book_test}
      DB_PASSWORD: ${TEST_DB_PASSWORD:-client-book-test}
      FILESYSTEM_DISK: local
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit-test
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: test@example.com
      MAIL_FROM_NAME: "Commlink"
      # Pinned, not inherited: server/.env is mounted with the source, so
      # without these a developer's real Twilio settings would leak in and
      # the suite would text actual phones.
      SMS_TRANSPORT: log
      TWILIO_SID: ""
      TWILIO_AUTH_TOKEN: ""
      EMAIL_TRANSPORT: log
      INBOX_SMS_WEBHOOK_URL: ""
      # Same reason: no Reverb server runs in the test stack (see reverb-dev
      # under dev), so a live "reverb" connection here would fail every
      # request that broadcasts.
      BROADCAST_CONNECTION: log
    volumes:
      - ./server:/var/www/html
    depends_on:
      db-test:
        condition: service_healthy
      mailpit-test:
        condition: service_started
    profiles: [test]

  # Playwright asserts against Mailpit's HTTP API on ${TEST_MAILPIT_PORT}.
  mailpit-test:
    image: axllent/mailpit
    ports:
      - "${TEST_MAILPIT_PORT:-9025}:8025"
    profiles: [test]

  api-test:
    build:
      context: ./server
      target: web
    environment:
      FPM_HOST: app-test
    ports:
      - "${TEST_HTTP_PORT:-9080}:80"
    volumes:
      - ./server/public:/var/www/html/public:ro
    depends_on:
      - app-test
    profiles: [test]

  web-test:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:9080
    ports:
      - "${TEST_WEB_PORT:-9081}:80"
    depends_on:
      - api-test
    profiles: [test]

  db-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${TEST_DB_DATABASE:-client_book_test}
      POSTGRES_USER: ${TEST_DB_USERNAME:-client_book_test}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-client-book-test}
    ports:
      - "${TEST_DB_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_DB_USERNAME:-client_book_test} -d ${TEST_DB_DATABASE:-client_book_test}"]
      interval: 2s
      timeout: 3s
      retries: 30
    profiles: [test]

volumes:
  db-data:
  minio-data:
  web-node-modules:

networks:
  dokploy-network:
    external: true
