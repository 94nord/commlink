# One multi-stage Dockerfile, three profiles:
#
#   prod  — app + web only; every value injected by the deployment platform
#   dev   — adds PostgreSQL, MinIO and the Vite dev server over live-mounted
#           source; nginx terminates self-signed TLS (make certs first)
#   test  — isolated, disposable stack on its own ports; boots into a
#           freshly-migrated empty database and can run alongside dev
#
#   Surface              Dev          Test
#   App (HTTPS / HTTP)   8443 / 8080  9080 (HTTP)
#   Vite HMR             5173         —
#   PostgreSQL           5432         5433
#   MinIO API / console  9000 / 9001  —

name: inspection-book

services:
  # ── production ──────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      target: app
      args:
        INSTALL_DEV_DEPENDENCIES: "false"
    restart: unless-stopped
    env_file: .env
    profiles: [prod]

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      FPM_HOST: app
    depends_on:
      - app
    networks:
      - default
      - dokploy-network
    profiles: [prod]

  # ── development ─────────────────────────────────────────────────────────────
  app-dev:
    build:
      context: .
      target: app
      args:
        INSTALL_DEV_DEPENDENCIES: "true"
    entrypoint: entrypoint-dev.sh
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    profiles: [dev]

  web-dev:
    build:
      context: .
      target: web
    environment:
      FPM_HOST: app-dev
    ports:
      - "${DEV_HTTPS_PORT:-8443}:443"
      - "${DEV_HTTP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/templates-dev:/etc/nginx/templates:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app-dev
    profiles: [dev]

  vite:
    image: node:24-alpine
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run dev"
    environment:
      VITE_POLLING: "1"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      # Shadow the host's node_modules: native binaries differ per platform.
      - vite-node-modules:/var/www/html/node_modules
    profiles: [dev]

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DEV_DB_PORT:-5432}:5432"
    volumes:
      # postgres:18+ keeps PGDATA in a versioned subdirectory of this mount
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 2s
      timeout: 3s
      retries: 30
    profiles: [dev]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "${DEV_MINIO_PORT:-9000}:9000"
      - "${DEV_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    profiles: [dev]

  # ── test ────────────────────────────────────────────────────────────────────
  app-test:
    build:
      context: .
      target: app
      args:
        INSTALL_DEV_DEPENDENCIES: "true"
    entrypoint: entrypoint-test.sh
    environment:
      APP_ENV: testing
      APP_DEBUG: "true"
      APP_URL: http://localhost:9080
      DB_CONNECTION: pgsql
      DB_HOST: db-test
      DB_PORT: 5432
      DB_DATABASE: ${TEST_DB_DATABASE:-inspection_book_test}
      DB_USERNAME: ${TEST_DB_USERNAME:-inspection_book_test}
      DB_PASSWORD: ${TEST_DB_PASSWORD:-inspection-book-test}
      FILESYSTEM_DISK: local
      MAIL_MAILER: log
    volumes:
      - .:/var/www/html
    depends_on:
      db-test:
        condition: service_healthy
    profiles: [test]

  web-test:
    build:
      context: .
      target: web
    environment:
      FPM_HOST: app-test
    ports:
      - "${TEST_HTTP_PORT:-9080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
    depends_on:
      - app-test
    profiles: [test]

  db-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${TEST_DB_DATABASE:-inspection_book_test}
      POSTGRES_USER: ${TEST_DB_USERNAME:-inspection_book_test}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-inspection-book-test}
    ports:
      - "${TEST_DB_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_DB_USERNAME:-inspection_book_test} -d ${TEST_DB_DATABASE:-inspection_book_test}"]
      interval: 2s
      timeout: 3s
      retries: 30
    profiles: [test]

volumes:
  db-data:
  minio-data:
  vite-node-modules:

networks:
  dokploy-network:
    external: true
